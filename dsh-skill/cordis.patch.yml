# dsh-coral-skill bundle patch
#
# 安装方式（本地路径；请把 <仓库路径> 换成你自己的绝对路径，不要照抄别人的）：
#   dsh plugin --profile desktop add "file:<仓库路径>\coral_ml\dsh-skill"
#
# 安装后本 patch 会被 profile 合并，等价于插入下面这一行插件条目；
# 卸载（dsh plugin --profile desktop remove dsh-coral-skill）后自动移除。
- insert:
    - id: coral-skill
      name: 'dsh-coral-skill'
