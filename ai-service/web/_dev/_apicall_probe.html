<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<main id="page-host"></main><pre id="out">…</pre><script src="/mp.js"></script>
<script>
 const log=[];const say=s=>{log.push(String(s));document.getElementById('out').textContent=log.join('\n');};
 setTimeout(async function(){
   try{
     const R=window.MP_RUNTIME; const api=R.require('/mp/utils/api.js');
     const cfg=R.require('/mp/utils/config.js');
     say('USE_MOCK='+cfg.USE_MOCK);
     say('getCoralDetail 类型: '+typeof api.getCoralDetail);
     for (const id of [undefined,'1','acropora-humilis']) {
       try { const r=await api.getCoralDetail(id);
             say('id='+id+' → '+(r? Object.keys(r).slice(0,8).join(',') : String(r)));
       } catch(e) { say('id='+id+' → 抛错: '+e.message); }
     }
     const mock=R.require('/mp/utils/mock.js');
     say('mock.coralDetail: '+(mock.coralDetail? JSON.stringify(Object.keys(mock.coralDetail).slice(0,8)):'undefined'));
   }catch(e){say('外层错: '+e.message+' | '+e.stack.slice(0,200));}
   say('DONE');
 },1200);
</script></body></html>
