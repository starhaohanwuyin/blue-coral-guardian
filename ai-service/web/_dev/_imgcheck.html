<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="fr" src="/" style="width:500px;height:900px"></iframe><pre id="out">…</pre>
<script>
 const fr=document.getElementById('fr');
 const pages=[{"url": "index"}, {"url": "adopt"}, {"url": "knowledge"}, {"url": "ai"}, {"url": "profile"}, {"url": "login"}, {"url": "knowledge-detail"}, {"url": "all-species"}, {"url": "coral-species?id=species-acropora-spp"}, {"url": "coral-detail"}, {"url": "camera"}, {"url": "article"}, {"url": "shop"}, {"url": "quiz"}, {"url": "donate"}, {"url": "cert"}, {"url": "camp"}, {"url": "aquarium"}, {"url": "badges"}, {"url": "growth"}, {"url": "my-adopt"}, {"url": "about"}, {"url": "agreement"}];
 let i=0; const lines=[];
 function next(){
   if(i>=pages.length){ document.getElementById('out').textContent=lines.join('\n')+'\nDONE'; return; }
   const pg=pages[i++];
   fr.contentWindow.location.hash='#/'+pg.url;
   setTimeout(function(){
     const d=fr.contentDocument;
     const imgs=Array.from(d.querySelectorAll('#page-host img'));
     const broken=imgs.filter(function(im){ return im.complete && im.naturalWidth===0; });
     const ph=d.querySelectorAll('.mp-img-ph').length;
     lines.push(pg.url+'  img='+imgs.length+' broken='+broken.length+' placeholder='+ph+
                (broken.length?('  ['+broken.map(function(b){return (b.getAttribute('src')||'').split('/').pop();}).join(',')+']'):''));
     next();
   }, 2600);
 }
 setTimeout(next, 1200);
</script></body></html>
