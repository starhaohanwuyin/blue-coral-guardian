<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="fr" src="/" style="width:480px;height:900px"></iframe><pre id="out">…</pre>
<script>
 const pages=['index','knowledge','growth','all-species','camp'];
 let i=0; const lines=[];
 const fr=document.getElementById('fr');
 function next(){
   if(i>=pages.length){document.getElementById('out').textContent=lines.join('\n')+'\nDONE';return;}
   const p=pages[i++];
   fr.contentWindow.location.hash='#/'+p;
   setTimeout(function(){
     const d=fr.contentDocument;
     const h=d.querySelector('.custom-header .logo');
     const logo=h?(h.textContent||'').trim():'(无 header)';
     lines.push(p.padEnd(14)+' logo="'+logo+'"');
     next();
   }, 2200);
 }
 setTimeout(next, 1500);
</script></body></html>
