<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<main id="page-host"></main><pre id="out">…</pre>
<script>
 localStorage.setItem('coralweb:coral_api_base', JSON.stringify('http://127.0.0.1:8038'));
 localStorage.setItem('coralweb:coral_api_token', JSON.stringify('test-token-xyz'));
 const LOG=[]; const _f=window.fetch;
 window.fetch=function(u,o){
   LOG.push('FETCH '+String(u).slice(0,70)+' headers='+JSON.stringify((o&&o.headers)||{}));
   return _f.apply(this,arguments).then(function(r){ LOG.push('  → HTTP '+r.status); return r; });
 };
</script>
<script src="/mp.js"></script>
<script>
 const log=[];const say=s=>{log.push(String(s));document.getElementById('out').textContent=log.join('\n');};
 setTimeout(async function(){
   try{
     const R=window.MP_RUNTIME; const api=R.require('/mp/utils/api.js');
     const cfg=R.require('/mp/utils/config.js');
     say('cfg.token='+JSON.stringify(cfg.CORAL_API_TOKEN));
     // 直接看 api.js 是否真的把 token 放进 header：手动构造一次上传
     const base=await api.resolveApiBase();
     say('base='+base);
     const blob=await _f(base+'/sample?index=0&set=semporna').then(r=>r.blob());
     LOG.length=0;
     const res=await api.recognize(URL.createObjectURL(blob), {lat:4.4,lon:118.8}, 2024);
     say('--- fetch 记录 ---');
     LOG.forEach(function(l){say(l);});
     say('isDemo='+res.isDemo+' demoReason='+String(res.demoReason||'').slice(0,80));
   }catch(e){say('ERROR '+e.message);}
   say('DONE');
 }, 1200);
</script></body></html>
